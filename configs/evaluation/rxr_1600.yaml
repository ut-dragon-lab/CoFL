# Evaluation inputs and Habitat sensors for the fixed RxR-1600 dataset.
# Data preparation generates annotations only; model/execution settings live
# in cofl_s_rxr_online.yaml. Adapt scene/interpreter paths for your machine.
online:
  dataset_data_path: ../../prepared/rxr_1600/selected_episodes.json.gz
  gt_path: ../../prepared/rxr_1600/selected_gt.json.gz
  landmark_rxr_json: ../../prepared/rxr_1600/selected_landmark_rxr.json
  scenes_dir: ../../data/scene_datasets
  habitat_python: ../../.habitat/bin/python
  habitat_config: rxr_1600.yaml
  split: val_unseen
  language_filter: en
  instruction_mode: oracle
  oracle_source: landmark_rxr
  oracle_unavailable: error
  progress_lookahead: 6
  hfov_deg: 79.0
  ndtw_fdtw: true
SIMULATOR:
  TURN_ANGLE: 30
  TILT_ANGLE: 30
  ACTION_SPACE_CONFIG: v1
  AGENT_0:
    SENSORS:
    - RGB_SENSOR
    - DEPTH_SENSOR
    HEIGHT: 0.88
    RADIUS: 0.18
  HABITAT_SIM_V0:
    GPU_DEVICE_ID: 0
    ALLOW_SLIDING: false
  RGB_SENSOR:
    WIDTH: 640
    HEIGHT: 480
    HFOV: 79
    POSITION:
    - 0
    - 0.88
    - 0
  DEPTH_SENSOR:
    WIDTH: 640
    HEIGHT: 480
    HFOV: 79
    MIN_DEPTH: 0.0
    MAX_DEPTH: 10.0
    NORMALIZE_DEPTH: false
    POSITION:
    - 0
    - 0.88
    - 0
