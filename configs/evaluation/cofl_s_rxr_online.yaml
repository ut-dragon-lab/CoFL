# CoFL-S on the fixed RxR-1600 Landmark-RxR dataset.
# Prepare benchmarks/rxr_1600/dataset.json into prepared/rxr_1600 first.
# Run from the CoFL root:
#   uv run --locked python -m cofl.online --config configs/evaluation/cofl_s_rxr_online.yaml
# The environment recipe requires Landmark-RxR without native/full-text fallback.
# Relative paths resolve against the YAML file that declares them.
benchmark: rxr_1600.yaml
checkpoint: ../../checkpoints/cofl-s/best.ckpt
output: ../../artifacts/online/cofl-s-rxr-1600
device: cuda:0
instruction_mode: oracle
start: 0
stride: 1
count: null
episode: null
resume: false
group_by_scene: true
reuse_scene: true
inference_backend: auto
workers: 16 # Different worker may cause different metric results due to non-deterministic environment and model inference.
worker_threads: 1
inference_batch_size: 16
batch_wait_ms: 2.0
parameters:
  max_time_s: 120.0
  max_steps: 500
  plant_hz: 100.0
  controller_hz: 50.0
  sensor_hz: 30.0
  planner_hz: 5.0
  policy_steps: 100
  policy_dt: 0.01
  field_grid_size: 100
  field_query_chunk_size: 4096
  stop_threshold: 0.0
  stop_endpoint_m: 0.2
  stop_pool_step: 0.5
  oscillation_window: 4
  oscillation_fwd_stop_max: 1.0
  turn_in_place_lookahead_m: 1.0
  lookahead_m: 0.5
  max_linear_mps: 0.5
  max_angular_radps: 1.0471975511965976
  rotate_threshold_deg: 30.0
