# 2. Ignore Labels
# Labels that should be completely ignored (treated as void/unknown).
ignore_labels:
  - "unknown"
  - "delete"
  - "remove"
  - "void"
  - "unlabeled"
  - "misc"
  - "other"
  - "object"
  - "objects"
  - "clutter"
  - "stuff"
  - "junk"
  - "debris"
  - "reflection"

# 3. Walkable Categories
# Categories that represent the ground/floor where the robot can travel.
walkable_categories:
  - "floor"
  - "carpet"
  - "ground"
  - "stair"
  - "stairs" # Explicitly added as requested
  - "tile"
  - "wood"
