# 7. Instruction Generation Config
instruction_config:
  action_verbs:
    - "move to"
    - "go to"
    - "navigate to"
    - "approach"
    - "reach"
    - "head to"
    - "travel to"
    - "proceed to"
    - "advance to"
    - "walk to"
  
  position_descriptors:
    center: ["", "position of", "place of"]
    front: ["front", "front of", "in front of", "before", "ahead of"]
    back: ["back", "back of", "behind", "rear of", "beyond"]
    left: ["left", "left of", "left side of", "on the left of"]
    right: ["right", "right of", "right side of", "on the right of"]

  templates:
    - "{verb} {obj}"
    - "{verb} the {obj}"
    - "{verb} {pos} the {obj}"
    - "{verb} {pos} {obj}"
    - "can you {verb} {obj}"
    - "please {verb} the {obj}"
    - "{obj} {pos}"
